name: Build Unsigned IPA — MyGodotGame

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme name"
        required: true
        default: "MyGodotGame"
      project_path:
        description: "Path to .xcodeproj inside the repo"
        required: true
        default: "ios/MyGodotGame.xcodeproj"
      output_name:
        description: "Output IPA file name (without .ipa)"
        required: true
        default: "MyGodotGame"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_*.app/Contents/Developer

      - name: List available schemes (useful for debugging)
        run: |
          xcodebuild -project "${{ github.event.inputs.project_path }}" -list

      - name: Build .app bundle (unsigned)
        run: |
          xcodebuild             -project "${{ github.event.inputs.project_path }}"             -scheme "${{ github.event.inputs.scheme }}"             -destination "generic/platform=iOS"             -configuration Release             clean build             CONFIGURATION_BUILD_DIR="${{ github.workspace }}/build"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             ENTITLEMENTS_FILE=""

      - name: Package .app into IPA
        run: |
          mkdir -p Payload
          cp -R "${{ github.workspace }}/build/${{ github.event.inputs.scheme }}.app" Payload/
          zip -r "${{ github.event.inputs.output_name }}.ipa" Payload
          ls -lh "${{ github.event.inputs.output_name }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}-ipa
          path: "${{ github.event.inputs.output_name }}.ipa"