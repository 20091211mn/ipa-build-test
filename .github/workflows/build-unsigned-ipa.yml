name: Build Unsigned IPA — MyGodotGame

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme name"
        required: true
        default: "TestApp"
      project_path:
        description: "Path to .xcodeproj or .xcworkspace inside the repo"
        required: true
        default: "TestApp.xcodeproj"
      output_name:
        description: "Output IPA file name (without .ipa)"
        required: true
        default: "TestApp"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for XC_APP in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            if sudo xcode-select -s "$XC_APP/Contents/Developer" 2>/dev/null; then
              echo "Using Xcode: $XC_APP"
              break
            fi
          done
          echo "Active developer dir: $(xcode-select -p)"
          xcodebuild -version

      - name: Generate Xcode project if missing (XcodeGen)
        run: |
          if ! find . -maxdepth 4 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | grep -q . ; then
            if [ -f project.yml ]; then
              echo "No Xcode project found — generating from project.yml"
              brew install xcodegen
              xcodegen generate
            fi
          fi


      - name: Resolve project or workspace
        id: project
        run: |
          INPUT_PATH="${{ github.event.inputs.project_path }}"
          if [ -d "$INPUT_PATH" ] || [ -f "$INPUT_PATH" ]; then
            echo "path=$INPUT_PATH" >> "$GITHUB_OUTPUT"
            if [[ "$INPUT_PATH" == *.xcworkspace ]]; then
              echo "type=-workspace" >> "$GITHUB_OUTPUT"
            else
              echo "type=-project" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Input path not found: $INPUT_PATH — searching repo..."
            FOUND=$(find . -maxdepth 4 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | head -1 | sed 's|^\./||')
            if [ -z "$FOUND" ]; then
              echo "No .xcodeproj or .xcworkspace found" >&2
              exit 1
            fi
            echo "Found: $FOUND"
            echo "path=$FOUND" >> "$GITHUB_OUTPUT"
            if [[ "$FOUND" == *.xcworkspace ]]; then
              echo "type=-workspace" >> "$GITHUB_OUTPUT"
            else
              echo "type=-project" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Resolve scheme
        id: scheme
        run: |
          set -e
          LIST=$(xcodebuild "${{ steps.project.outputs.type }}" "${{ steps.project.outputs.path }}" -list)
          echo "$LIST"
          SCHEMES=$(echo "$LIST" | awk '/Schemes:/{flag=1;next}flag{gsub(/^ +| +$/,"");if($0=="")exit;print}')
          WANTED="${{ github.event.inputs.scheme }}"
          if echo "$SCHEMES" | grep -Fxq "$WANTED"; then
            CHOSEN="$WANTED"
          else
            CHOSEN=$(echo "$SCHEMES" | head -1)
            echo "Scheme '$WANTED' not found — using '$CHOSEN'"
          fi
          if [ -z "$CHOSEN" ]; then
            echo "No scheme found in project" >&2
            exit 1
          fi
          echo "name=$CHOSEN" >> "$GITHUB_OUTPUT"

      - name: Build .app bundle (unsigned)
        run: |
          set -e
          xcodebuild \
            "${{ steps.project.outputs.type }}" "${{ steps.project.outputs.path }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "${{ github.workspace }}/DerivedData" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_FILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Locate built .app and package IPA
        run: |
          set -e
          APP_PATH=$(find "${{ github.workspace }}/DerivedData" -name '*.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in DerivedData" >&2
            find "${{ github.workspace }}/DerivedData" -type d >&2 || true
            exit 1
          fi
          echo "Found .app: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "${{ github.event.inputs.output_name }}.ipa" Payload
          ls -lh "${{ github.event.inputs.output_name }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}-ipa
          path: "${{ github.event.inputs.output_name }}.ipa"
