name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project TestApp.xcodeproj \
            -scheme TestApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_FILE="" \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          APP=$(find build -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          cp -R "$APP" Payload/
          zip -qr TestApp.ipa Payload
          ls -lh TestApp.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: TestApp.ipa
